# ---------------------------------------------------------------------------
# Items shown per section in the email. Unlisted dc_* sections use dc_default, us_* use
# us_default. Northern Virginia gets the most room.
# ---------------------------------------------------------------------------

[limits]
dc_nova = 10
dc_dc = 5
dc_maryland = 5
dc_regional = 5
us_default = 5
world = 4

# ---------------------------------------------------------------------------
# Archive: the region's transportation history, one chunk per email.
#   anchor      the first day the archive ran; day 0 of the schedule. Do not change it after
#               launch, or the chunks shift.
#   passes      day 0 is start_year, day 1 the year before, down to end_year ("year" pass);
#               then, with roots = true, one chunk of curated landmarks from before end_year;
#               then the next pass ("quarter": one quarter per email from the most recent
#               complete quarter back to end_year) for depth. Kinds: year, half, quarter,
#               month, week. When every chunk has run, the section shows "this week in
#               earlier years".
#   min_items   the section is topped up from the searched candidates to at least this many
#   max_items   cap per email (landmarks are never dropped)
#   queries     Google News searches run per period with after:/before: dates appended;
#               results are classified like live news, then scored for policy relevance
#   policy_keywords    boost signs of a policy decision or milestone
#   incident_keywords  stories matching these and no policy word are dropped (crashes, weather)
# `news_digest.py archive-plan --days 12 --verbose` previews the schedule;
# `run --archive-period 2019` (or 2019-Q4, 2019-H1, 2019-11, 2019-11-04) replays one chunk.
# ---------------------------------------------------------------------------

[archive]
enabled = true
anchor = "2026-09-16"
passes = ["year", "quarter"]
start_year = 2025
end_year = 2016
roots = true
order = "backward"
min_items = 10
max_items = 14
landmarks_file = "archive.toml"
queries = [
  '(VDOT OR "Commonwealth Transportation Board" OR "General Assembly" OR "Smart Scale" OR "Express Lanes" OR toll OR tolls) ("Northern Virginia" OR Fairfax OR Arlington OR Loudoun OR "Prince William" OR Alexandria)',
  '("Board of Supervisors" OR "County Board" OR "City Council" OR "Town Council") (Fairfax OR Arlington OR Loudoun OR "Prince William" OR Alexandria OR "Falls Church" OR Herndon OR Vienna OR Leesburg OR Manassas) (transportation OR road OR transit OR parking OR bus OR toll OR traffic)',
  '(WMATA OR Metrorail OR Metrobus OR "Metro board" OR "Silver Line" OR VRE OR "Purple Line" OR "Long Bridge") (funding OR fares OR budget OR opens OR approves OR agreement OR safety OR ridership)',
  "(DDOT OR \"D.C. Council\" OR MDOT OR \"Montgomery County\" OR \"Prince George's\" OR \"I-270\" OR \"American Legion Bridge\" OR \"Vision Zero\") (transportation OR transit OR toll OR \"speed cameras\" OR \"bus lanes\" OR plan OR approves)",
]
policy_keywords = [
  "approve", "approves", "approved", "approval", "vote", "votes", "voted", "passes", "passed",
  "signs", "signed", "law", "bill", "legislation", "General Assembly", "Council", "Board of Supervisors",
  "County Board", "budget", "funding", "fund", "grant", "bond", "tax", "fee", "fees", "toll", "tolls",
  "tolling", "fare", "fares", "plan", "study", "contract", "agreement", "partnership", "P3",
  "opens", "opening", "groundbreaking", "completed", "cancels", "cancelled", "canceled", "delay",
  "delayed", "ordinance", "policy", "rule", "regulation", "Vision Zero", "speed cameras",
  "enforcement", "ridership", "service cuts", "expansion", "Smart Scale", "VDOT", "WMATA", "Metro board",
  "NVTA", "NVTC", "DDOT", "MDOT", "governor", "mayor", "supervisor", "supervisors", "delegate", "senator",
]
incident_keywords = [
  "crash", "crashes", "killed", "dies", "dead", "injured", "shooting", "stabbing", "arrested", "charged",
  "police", "pursuit", "fire", "snow", "storm", "flooding", "power outage", "lottery", "weather",
]

