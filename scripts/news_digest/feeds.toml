# Sources and settings for /news-digest (scripts/news_digest/news_digest.py).
#
# The digest is US-focused with the Washington region first: Northern Virginia at state,
# county, and city or town level, then the District, Maryland, and region-wide bodies
# (WMATA, MWCOG, MWAA). United States news follows by topic, then a few major world items,
# then an archive section that walks through the region's transportation history.
#
# Each [[feed]] entry has:
#   name        display name used in the email footer and, for ordinary feeds, on items
#   url         RSS / Atom URL (a local file path is also accepted, for tests)
#     or
#   google_news a Google News search query; the script builds the RSS URL and appends the
#               recency operator in [settings].google_news_recency. Items carry the real
#               outlet as their source. This is how large outlets without public feeds
#               (Reuters, AP, Bloomberg, Politico Pro, local TV) and small local papers
#               get in without maintaining dozens of feed URLs.
#   topic       transportation | energy | environment | industrial_organization | auto
#               "auto" classifies each item by the [topics] keywords and drops non-matches.
#   region      us (default) | dc (a Washington-region local source) | world
#   subregion   for region = "dc": nova | dc | maryland | regional, used when no place
#               keyword resolves on an item (default: [settings].default_local_region)
#   weight      ranking multiplier, default 1.0 (0.5 = de-emphasize, 1.5 = boost)
#
# Feeds are fetched independently; one dead feed never fails the run. The email footer
# lists feeds that returned nothing, and `news_digest.py check-feeds` prints a full
# health report. Prune or replace entries that stay dead.

[settings]
lookback_hours = 26               # window for "the past day" (26 gives slack for late feeds)
max_candidates_per_section = 25   # items offered to the summarizer per section
timezone = "America/New_York"     # used for dates in the email and --only-at-hour
require_date = true               # skip entries with no publication date (avoids daily repeats)
default_local_region = "regional" # where an item from a local feed goes when no place resolves
google_news_recency = "when:2d"   # appended to every google_news query
# Words that mark a story as being about traffic or transport even when the topic keywords
# below do not fire (local feeds carry crime and politics too; this keeps only the road,
# rail, transit, and street stories).
traffic_keywords = [
  "traffic", "crash", "collision", "lane closure", "lane closures", "lanes closed", "road closure",
  "road closures", "closure", "detour", "congestion", "commute", "commuters", "commuting", "rush hour",
  "toll", "tolls", "tolling", "HOV", "express lanes", "HOT lanes", "speed camera", "speed cameras",
  "red-light camera", "automated enforcement", "Vision Zero", "pedestrian", "pedestrians", "cyclist",
  "cyclists", "bike lane", "bike lanes", "bus lane", "bus lanes", "transit", "Metro", "Metrorail",
  "Metrobus", "bus", "buses", "rail", "parking", "road work", "roadwork", "bridge", "interchange",
  "widening", "intersection", "roundabout", "sidewalk", "sidewalks", "trail", "ridership", "fare",
  "fares", "bike", "scooter", "scooters", "Capital Bikeshare", "highway", "interstate", "parkway",
  "gas tax", "vehicle miles", "truck", "trucks", "freight", "airport", "flights", "Amtrak", "VRE",
  "MARC", "streetcar", "light rail", "BRT", "bus rapid transit", "guardrail", "pavement", "potholes",
  "speed limit", "speeding", "traffic deaths", "traffic fatalities", "road safety", "transportation",
]

