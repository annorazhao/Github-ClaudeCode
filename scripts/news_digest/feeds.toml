# Sources and settings for /news-digest (scripts/news_digest/news_digest.py).
#
# Each [[feed]] entry has:
#   name   display name used in the email
#   url    RSS / Atom URL (a local file path is also accepted, for tests)
#   topic  transportation | energy | environment | industrial_organization | auto
#          "auto" means: classify every item by the keyword lists under [topics]
#          and drop items that match none of them. Use it for general-news feeds.
#   weight optional ranking multiplier, default 1.0 (0.5 = de-emphasize, 1.5 = boost)
#
# Feeds are fetched independently; one dead feed never fails the run. The email footer
# lists feeds that returned nothing, and `news_digest.py check-feeds` prints a full
# health report. Prune or replace entries that stay dead.

[settings]
lookback_hours = 26            # window for "the past day" (26 gives slack for late feeds)
max_items_per_topic = 8        # items shown per section in the email
max_candidates_per_topic = 30  # items offered to the summarizer per section
timezone = "America/New_York"  # used for dates in the email and --only-at-hour
require_date = true            # skip entries with no publication date (avoids daily repeats)

# ---------------------------------------------------------------------------
# Topics. Order here is the order of sections in the email.
# Keywords are matched case-insensitively on whole words/phrases in title + summary.
# ---------------------------------------------------------------------------

[topics.transportation]
label = "Transportation"
keywords = [
  "transportation", "transport", "transit", "highway", "freight", "rail", "railroad",
  "railway", "trucking", "trucks", "airline", "airlines", "aviation", "airport", "port",
  "ports", "shipping", "maritime", "autonomous vehicle", "self-driving", "robotaxi",
  "electric vehicle", "electric vehicles", "EV", "EVs", "congestion pricing", "toll",
  "infrastructure", "FAA", "DOT", "NHTSA", "FHWA", "Amtrak", "bus", "buses", "ride-hail",
  "ridehailing", "Uber", "Lyft", "Waymo", "traffic", "logistics", "supply chain",
  "fuel economy", "CAFE standards", "automaker", "automakers", "vehicle", "vehicles",
  "commute", "bike lane", "high-speed rail", "Boeing", "Airbus", "tariffs on cars",
]

[topics.energy]
label = "Energy"
keywords = [
  "energy", "electricity", "power grid", "grid", "utility", "utilities", "natural gas",
  "LNG", "oil", "crude", "OPEC", "gasoline", "diesel", "refinery", "pipeline", "solar",
  "wind", "offshore wind", "nuclear", "reactor", "battery", "batteries", "storage",
  "hydrogen", "coal", "renewable", "renewables", "FERC", "EIA", "PJM", "ERCOT", "ISO",
  "capacity market", "transmission", "interconnection", "data center", "data centers",
  "electricity prices", "power prices", "rate case", "net metering", "IRA tax credit",
  "clean energy", "fossil fuel", "fracking", "shale", "Exxon", "Chevron", "Shell",
]

[topics.environment]
label = "Environment"
keywords = [
  "environment", "environmental", "climate", "emissions", "carbon", "CO2", "methane",
  "greenhouse", "pollution", "air quality", "water quality", "PFAS", "EPA", "Clean Air Act",
  "Clean Water Act", "NEPA", "endangered species", "wildfire", "wildfires", "drought",
  "flood", "flooding", "hurricane", "heat wave", "sea level", "conservation", "biodiversity",
  "deforestation", "recycling", "plastic", "toxic", "superfund", "carbon tax", "cap-and-trade",
  "carbon market", "carbon capture", "net zero", "Paris Agreement", "COP", "IPCC",
  "climate policy", "environmental justice", "resilience", "adaptation",
]

[topics.industrial_organization]
label = "Industrial Organization & Antitrust"
keywords = [
  "antitrust", "anti-trust", "merger", "mergers", "acquisition", "acquires", "acquire",
  "takeover", "buyout", "monopoly", "monopolization", "monopsony", "FTC", "Federal Trade Commission",
  "DOJ", "Justice Department", "competition", "competition policy", "market power",
  "price fixing", "price-fixing", "collusion", "cartel", "bid rigging", "regulation",
  "regulator", "regulators", "deregulation", "platform", "platforms", "Big Tech", "Amazon",
  "Google", "Alphabet", "Meta", "Apple", "Microsoft", "Nvidia", "vertical integration",
  "consolidation", "oligopoly", "market concentration", "concentration", "entry", "exit",
  "pricing", "algorithmic pricing", "surge pricing", "CMA", "European Commission",
  "Digital Markets Act", "DMA", "noncompete", "non-compete", "labor market power",
  "hospital merger", "airline merger", "deal", "divestiture", "consent decree", "Section 2",
  "Sherman Act", "Clayton Act", "HSR", "Hart-Scott-Rodino", "class action", "price discrimination",
]

