# Curated landmarks in the Washington region's traffic and transportation policy history,
# with an emphasis on Northern Virginia. Used by the archive section of /news-digest:
# tier-1 entries fill the first `landmark_days` digests; every entry also appears in the
# week-by-week archive when its week comes up, and again in "this week in earlier years".
#
# Fields
#   date        YYYY-MM-DD, YYYY-MM (month known), or YYYY (year known)
#   tier        1 = the most consequential (shown first), 2 = major, 3 = notable
#   title, summary, why_it_matters (optional)
#   jurisdiction, level   federal | state | regional | county | city | town
#   confidence  high | medium ("medium" prints "details to verify" next to the item)
#   query       search string used to build a dated "search contemporary coverage" link
#   url         optional; add a confirmed article link and it replaces the search link
#
# These entries were written from general knowledge, not fetched from the web, so each one
# links to a dated web search rather than to an article. Confirm dates and figures before
# citing any of them in research. Add, correct, or remove entries freely.

[[landmark]]
date = "2002-11-05"
tier = 3
title = "Northern Virginia voters reject a half-cent sales tax for transportation"
jurisdiction = "Northern Virginia"
level = "regional"
confidence = "high"
summary = "A referendum that would have raised the Northern Virginia sales tax to fund roads and transit failed at the polls, alongside a similar measure in Hampton Roads. The defeat shaped the next decade of funding fights and pushed the region toward tolling, public-private partnerships, and later legislative packages rather than a voter-approved regional tax."
query = "Northern Virginia sales tax referendum transportation defeated November 2002"

